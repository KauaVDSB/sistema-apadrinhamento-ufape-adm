<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoria de Estados de Erro HTTP • Apadrinhamento UFAPE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body style="padding: 2rem 1rem; background: var(--swan-offwhite);">
  <div class="container" style="max-width: 680px; margin: 0 auto;">
    
    <div style="background: #fff; border-radius: var(--radius-lg); padding: 2rem; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-md); text-align: center; margin-bottom: 2rem;">
      <span style="background: var(--royal-navy); color: var(--warm-gold); font-size: 0.75rem; font-weight: 800; padding: 0.35rem 0.8rem; border-radius: var(--radius-full); text-transform: uppercase;">
        Sprint 02 • Auditoria Visual
      </span>
      <h1 style="font-size: 1.6rem; color: var(--royal-navy); font-weight: 800; margin: 1rem 0 0.5rem 0;">
        Design System de Erros HTTP (ADR-007)
      </h1>
      <p style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.5rem;">
        Teste interativo dos modais de tratamento de exceções do sistema de apadrinhamento (LGPD, isolamento de rotas e tolerância a falhas).
      </p>

      <div style="display: grid; grid-template-columns: 1fr; gap: 0.8rem;">
        <button id="btn-test-401" class="btn btn-outline btn-lg" style="justify-content: space-between;">
          <span style="font-weight: 700;">Simular Erro 401 (Não Autenticado)</span>
          <span class="error-status-badge badge-navy">401 Auth</span>
        </button>

        <button id="btn-test-403" class="btn btn-outline btn-lg" style="justify-content: space-between;">
          <span style="font-weight: 700;">Simular Erro 403 (Acesso Proibido / LGPD)</span>
          <span class="error-status-badge badge-gold">403 RLS</span>
        </button>

        <button id="btn-test-404" class="btn btn-outline btn-lg" style="justify-content: space-between;">
          <span style="font-weight: 700;">Simular Erro 404 (Recurso Não Encontrado)</span>
          <span class="error-status-badge badge-slate">404 404</span>
        </button>

        <button id="btn-test-500" class="btn btn-outline btn-lg" style="justify-content: space-between;">
          <span style="font-weight: 700;">Simular Erro 500 (Falha de Servidor / Rede)</span>
          <span class="error-status-badge badge-coral">500 Server</span>
        </button>

        <a href="404.html" class="btn btn-secondary btn-lg" style="justify-content: center; margin-top: 0.5rem;">
          Ver Página Estática 404.html (Deploy Vercel) ➔
        </a>
      </div>
    </div>

    <div style="text-align: center;">
      <a href="index.html" class="btn btn-primary btn-sm">
        Voltar à Página Principal
      </a>
    </div>

  </div>

  <script type="module">
    import { httpErrorHandler } from './js/error-handler.js';

    document.getElementById('btn-test-401').addEventListener('click', () => {
      httpErrorHandler.show(401);
    });

    document.getElementById('btn-test-403').addEventListener('click', () => {
      httpErrorHandler.show(403);
    });

    document.getElementById('btn-test-404').addEventListener('click', () => {
      httpErrorHandler.show(404);
    });

    document.getElementById('btn-test-500').addEventListener('click', () => {
      httpErrorHandler.show(500, {
        preserveData: true,
        onRetry: () => {
          alert('Callback de repetição (Retry) disparado com sucesso!');
          httpErrorHandler.hide();
        }
      });
    });
  </script>
</body>
</html>
